version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-platform-db
    environment:
      POSTGRES_USER: petplatform
      POSTGRES_PASSWORD: petplatform123
      POSTGRES_DB: pet_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pet-platform-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
